tracker_type: botsort

# This tracker is isolated from the normal person tracker. It serves only
# diagnostic continuity metadata for low-confidence Marvin proposals.
track_high_thresh: 0.02
track_low_thresh: 0.02
new_track_thresh: 0.02
track_buffer: 120
match_thresh: 0.90
fuse_score: False

gmc_method: sparseOptFlow

proximity_thresh: 0.00
appearance_thresh: 0.50
with_reid: True
model: auto
